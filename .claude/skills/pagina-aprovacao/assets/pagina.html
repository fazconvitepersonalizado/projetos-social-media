<title>__TITULO__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="__FONTES__">
<style>
/* Layout: o perfil da cliente como ele vai ficar no Instagram (cabeçalho,
   abas, grade 3:4, posts já publicados esmaecidos) e, ao abrir um post, a
   visualização de post do Instagram com a aprovação embaixo. A moldura de
   rede social é neutra; tudo que é da aprovação usa a marca da cliente. */
/*__TOKENS__*/
:root {
  --ig-bg: #ffffff; --ig-ink: #0c1014; --ig-muted: #737373; --ig-line: #dbdbdb;
  --ig-soft: #efefef; --ig-link: #00376b; --ig-overlay: rgba(0,0,0,.65);
  --f-ig: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ig-bg: #000000; --ig-ink: #f5f5f5; --ig-muted: #a8a8a8; --ig-line: #262626;
  --ig-soft: #1a1a1a; --ig-link: #e0f1ff; --ig-overlay: rgba(0,0,0,.75); } }
:root[data-theme="dark"] {
  --ig-bg: #000000; --ig-ink: #f5f5f5; --ig-muted: #a8a8a8; --ig-line: #262626;
  --ig-soft: #1a1a1a; --ig-link: #e0f1ff; --ig-overlay: rgba(0,0,0,.75); }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
html, body { height: 100%; }
body { background: var(--ig-bg); color: var(--ig-ink); font-family: var(--f-ig); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body.travado { overflow: hidden; }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- estrutura: barra lateral (marca da cliente) + perfil ---------- */
.app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 18px; overflow: hidden;
  padding: 22px 16px 18px max(18px, env(safe-area-inset-left, 0px));
  background: var(--surface); color: var(--ink); border-right: 1px solid var(--line); font-family: var(--f-body);
}
.marca { display: flex; align-items: center; gap: 10px; }
.marca p { margin: 0; }
.marca-nome { font-family: var(--f-display); font-weight: 600; font-size: 15.5px; line-height: 1.2; }
.marca-sub { font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.chip-logo { flex: none; width: 38px; height: 38px; border-radius: 9px; padding: 5px; background: var(--chip); border: 1px solid var(--line); display: grid; place-items: center; }
.chip-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
.chip-logo span { font-family: var(--f-display); font-size: 18px; color: var(--accent); }
.rot { margin: 0 0 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.meses { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.meses a, .meses span.m {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: 9px;
  color: var(--ink); text-decoration: none; font-size: 13.5px; border: 1px solid transparent;
}
.meses a:hover { background: var(--hover); }
.meses .atual { background: var(--accent-soft); border-color: var(--accent-line); font-weight: 600; }
.meses small { color: var(--muted); font-size: 11.5px; font-weight: 400; font-variant-numeric: tabular-nums; }
.meses .semlink { color: var(--muted); }
.prog { display: grid; gap: 6px; }
.prog .trilho-barra { height: 5px; border-radius: 99px; background: var(--track); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: inherit; transition: width .5s cubic-bezier(.22,.8,.24,1); }
.prog span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lista { list-style: none; margin: 0 -6px; padding: 0 6px; display: grid; gap: 2px; overflow-y: auto; flex: 1; min-height: 0; align-content: start; }
.item { width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 5px 6px; border: 1px solid transparent; border-radius: 10px; background: none; text-align: left; color: var(--ink); font-family: var(--f-body); }
.item:hover { background: var(--hover); }
.item[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent-line); }
.item img { width: 34px; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 4px; display: block; }
.item b { display: block; font-weight: 500; font-size: 13px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item small { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.pt { width: 18px; height: 18px; border-radius: 99px; display: grid; place-items: center; border: 1.5px dashed var(--line-strong); }
.pt svg { width: 10px; height: 10px; }
.pt[data-st="aprovado"] { border: 0; background: var(--ok); color: var(--on-ok); }
.pt[data-st="ajuste"] { border: 0; background: var(--warn); color: var(--on-warn); }
.acoes { display: grid; gap: 6px; }
.topo { display: none; }
.veu { position: fixed; inset: 0; z-index: 25; background: var(--ig-overlay); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 16px;
  border-radius: 10px; border: 1px solid var(--line-strong); background: var(--surface); font-family: var(--f-body);
  font-weight: 500; font-size: 14px; text-decoration: none; color: var(--ink); transition: background .2s, transform .15s;
}
.btn:hover { background: var(--hover); }
.btn:active { transform: translateY(1px); }
.btn-forte { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-forte:hover { background: var(--accent-deep); }
.salvo { margin: 0; font-size: 12px; color: var(--muted); }

/* ---------- perfil ---------- */
.perfil { width: 100%; max-width: 700px; margin: 0 auto; padding-block: 26px 56px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.cab { display: grid; grid-template-columns: 150px minmax(0, 1fr); align-items: center; padding-bottom: 24px; }
.avatar-anel { justify-self: center; width: 108px; height: 108px; border-radius: 50%; padding: 3px; background: var(--ig-bg); border: 1px solid var(--ig-line); display: grid; place-items: center; }
.avatar { width: 100%; height: 100%; border-radius: 50%; background: #fff; display: grid; place-items: center; overflow: hidden; padding: 18%; }
.avatar img { width: 100%; height: 100%; object-fit: contain; }
.avatar span { font-family: var(--f-display); font-size: 36px; color: var(--accent); }
.cab-info { display: grid; gap: 10px; min-width: 0; }
.handle-linha { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.handle { margin: 0; font-size: 18px; font-weight: 400; overflow-wrap: anywhere; }
.falso-btn { padding: 5px 14px; border-radius: 8px; background: var(--ig-soft); font-size: 13px; font-weight: 600; color: var(--ig-ink); }
.numeros { display: flex; gap: 24px; margin: 0; padding: 0; list-style: none; font-size: 14.5px; }
.numeros b { font-weight: 600; }
.bio { display: grid; gap: 2px; font-size: 14px; }
.bio b { font-weight: 600; }
.bio p { margin: 0; white-space: pre-line; }
.abas { display: flex; justify-content: center; gap: 48px; border-top: 1px solid var(--ig-line); }
.aba { display: flex; align-items: center; gap: 6px; height: 44px; margin-top: -1px; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ig-muted); border-top: 1px solid transparent; }
.aba.ativa { color: var(--ig-ink); border-top-color: var(--ig-ink); }
.aba svg { width: 12px; height: 12px; }
.grade { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; }
.mes-div { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 18px 2px 8px; font-family: var(--f-body); }
.mes-div:first-child { padding-top: 6px; }
.mes-div b { font-family: var(--f-display); font-weight: 600; font-size: 16px; color: var(--ig-ink); white-space: nowrap; }
.mes-div span { font-size: 12px; color: var(--ig-muted); white-space: nowrap; }
.mes-div::after { content: ""; flex: 1; height: 1px; background: var(--ig-line); }
.mes-div .tag-novo { padding: 2px 9px; border-radius: 99px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 11px; }
.cel { position: relative; aspect-ratio: 3 / 4; padding: 0; border: 0; overflow: hidden; background: var(--ig-soft); max-width: 100%; display: block; }
.cel img { width: 100%; height: 100%; object-fit: cover; display: block; }
button.cel::after { content: ""; position: absolute; inset: 0; background: rgba(0,0,0,0); transition: background .25s; }
button.cel:hover::after, button.cel:focus-visible::after { background: rgba(0,0,0,.3); }
.cel-ver { position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 15px; opacity: 0; transition: opacity .25s; }
button.cel:hover .cel-ver, button.cel:focus-visible .cel-ver { opacity: 1; }
.cel-tipo { position: absolute; right: 8px; top: 8px; z-index: 2; color: #fff; filter: drop-shadow(0 0 3px rgba(0,0,0,.45)); }
.cel-tipo svg { width: 20px; height: 20px; display: block; }
.selo {
  position: absolute; left: 8px; bottom: 8px; z-index: 3; display: inline-flex; align-items: center; gap: 5px;
  height: 24px; padding: 0 9px 0 6px; border-radius: 99px; font-family: var(--f-body); font-size: 11.5px; font-weight: 600;
  background: rgba(255,255,255,.93); color: #1d1d1d; box-shadow: 0 1px 6px rgba(0,0,0,.2);
}
.selo i { width: 14px; height: 14px; border-radius: 99px; display: grid; place-items: center; font-style: normal; font-size: 10px; color: #fff; background: #8a8a8a; }
.selo[data-st="aprovado"] i { background: var(--ok); }
.selo[data-st="ajuste"] i { background: var(--warn); color: var(--on-warn); }
.selo i svg { width: 9px; height: 9px; }
.cel-num { position: absolute; left: 8px; top: 8px; z-index: 2; height: 22px; min-width: 22px; padding: 0 7px; border-radius: 99px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; font-weight: 600; display: grid; place-items: center; font-variant-numeric: tabular-nums; }
.cel.antigo img { opacity: .38; filter: grayscale(.35); }
.cel.antigo .cel-tag { position: absolute; left: 8px; bottom: 8px; padding: 3px 8px; border-radius: 99px; background: rgba(0,0,0,.55); color: #fff; font-size: 11px; }
.nota-grade { margin: 18px 0 0; text-align: center; color: var(--ig-muted); font-size: 12.5px; }

/* ---------- post aberto ---------- */
.viewer { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: var(--ig-overlay); animation: aparece .25s ease both;
  padding: max(20px, env(safe-area-inset-top, 0px)) max(64px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(64px, env(safe-area-inset-left, 0px)); }
@keyframes aparece { from { opacity: 0; } }
@keyframes sobe { from { opacity: 0; transform: scale(.98); } }
.fora { position: absolute; z-index: 2; border: 0; background: none; color: #fff; display: grid; place-items: center; }
.fora svg { width: 26px; height: 26px; }
.fechar { right: max(14px, env(safe-area-inset-right, 0px)); top: max(14px, env(safe-area-inset-top, 0px)); width: 40px; height: 40px; }
.post-ant, .post-prox { top: 50%; width: 36px; height: 36px; margin-top: -18px; border-radius: 99px; background: rgba(255,255,255,.92); color: #111; }
.post-ant svg, .post-prox svg { width: 18px; height: 18px; }
.post-ant { left: max(14px, env(safe-area-inset-left, 0px)); } .post-prox { right: max(14px, env(safe-area-inset-right, 0px)); }
.post-ant[disabled], .post-prox[disabled] { visibility: hidden; }

.post { --h: min(calc(100vh - 60px), 720px, calc((100vw - 128px - 380px) * 1.25)); display: flex; height: var(--h); max-width: 100%;
  background: var(--ig-bg); border-radius: 4px; overflow: hidden; animation: sobe .3s cubic-bezier(.22,.8,.24,1) both; }
.midia { position: relative; height: 100%; aspect-ratio: 4 / 5; background: #000; flex: none; }
.palco { position: absolute; inset: 0; overflow: hidden; }
.palco-in { position: absolute; inset: 0; }
.palco-in iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; pointer-events: none; background: transparent; }
.palco-in img, .palco-in video { width: 100%; height: 100%; object-fit: cover; display: block; }
.arrasto { position: absolute; inset: 0; z-index: 2; touch-action: pan-y; cursor: grab; }
.arrasto:active { cursor: grabbing; }
.seta { position: absolute; top: 50%; z-index: 3; width: 30px; height: 30px; margin-top: -15px; border-radius: 99px; border: 0; background: rgba(255,255,255,.8); color: #262626; display: grid; place-items: center; box-shadow: 0 0 6px rgba(0,0,0,.2); transition: opacity .2s; }
.seta[disabled] { opacity: 0; pointer-events: none; }
.seta svg { width: 14px; height: 14px; }
.seta-esq { left: 10px; } .seta-dir { right: 10px; }
.pontos { position: absolute; left: 0; right: 0; bottom: 14px; z-index: 3; display: flex; justify-content: center; gap: 4px; pointer-events: none; }
.pontos button { pointer-events: auto; width: 6px; height: 6px; padding: 0; border: 0; border-radius: 99px; background: rgba(255,255,255,.45); position: relative; transition: background .2s; }
.pontos button[aria-current="true"] { background: #fff; }
.pontos button.mudou::after { content: ""; position: absolute; left: 50%; top: -6px; width: 4px; height: 4px; margin-left: -2px; border-radius: 99px; background: var(--warn); }
.play { position: absolute; inset: 0; z-index: 3; border: 0; background: rgba(0,0,0,.2); display: grid; place-items: center; color: #fff; }
.play span { width: 64px; height: 64px; border-radius: 99px; background: rgba(0,0,0,.55); display: grid; place-items: center; }

.lado { width: 380px; flex: none; display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--ig-line); }
.post-cab { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--ig-line); }
.mini-av { width: 32px; height: 32px; border-radius: 50%; background: #fff; border: 1px solid var(--ig-line); display: grid; place-items: center; overflow: hidden; padding: 5px; flex: none; }
.mini-av img { width: 100%; height: 100%; object-fit: contain; }
.mini-av span { font-family: var(--f-display); color: var(--accent); }
.post-cab b { font-weight: 600; font-size: 14px; }
.post-cab small { display: block; color: var(--ig-muted); font-size: 12px; }
.post-cab .tres { margin-left: auto; color: var(--ig-ink); }
.tres svg { width: 22px; height: 22px; display: block; }
.voltar-movel { display: none; }
.post-corpo { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: grid; gap: 14px; align-content: start; }
.comentario-cap { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; }
.comentario-cap p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.comentario-cap b { font-weight: 600; margin-right: 4px; }
.comentario-cap .tag { color: var(--ig-link); }
.comentario-cap small { display: block; margin-top: 8px; color: var(--ig-muted); font-size: 12px; }
.sem-leg { color: var(--ig-muted); font-style: italic; }
.editor { display: grid; gap: 12px; font-family: var(--f-body); }
.editor-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.editor-cab b { font-family: var(--f-display); font-weight: 600; font-size: 17px; }
.nota { margin: 0; font-size: 12.5px; color: var(--ig-muted); }
.campo { display: grid; gap: 5px; }
.campo label { font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ig-muted); display: flex; gap: 8px; }
.campo label em { font-style: normal; letter-spacing: 0; text-transform: none; color: var(--warn-ink); }
textarea { width: 100%; min-height: 58px; padding: 9px 11px; resize: vertical; border: 1px solid var(--ig-line); border-radius: 8px; background: var(--ig-bg); font-size: 14px; line-height: 1.45; }
textarea:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.campo.mudou textarea { border-color: var(--warn); }
.link-sutil { justify-self: start; border: 0; background: none; padding: 2px 0; font-size: 13px; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }

.acoes-ig { border-top: 1px solid var(--ig-line); padding: 6px 10px 4px; display: flex; align-items: center; gap: 2px; }
.acoes-ig .ico { width: 40px; height: 40px; display: grid; place-items: center; color: var(--ig-ink); }
.acoes-ig .ico svg { width: 24px; height: 24px; }
.acoes-ig .salvar { margin-left: auto; }
.btn-editar { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--ig-line); border-radius: 99px; padding: 6px 12px; background: var(--ig-bg); font-size: 13px; font-weight: 600; }
.btn-editar[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn-editar svg { width: 14px; height: 14px; }
.data-ig { padding: 0 16px 12px; font-size: 11px; letter-spacing: .03em; text-transform: uppercase; color: var(--ig-muted); }

.decisao { border-top: 1px solid var(--line); padding: 14px 16px 16px; display: grid; gap: 10px; background: var(--surface); color: var(--ink); font-family: var(--f-body); }
.decisao-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.decisao-cab span { font-size: 10.5px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.decisao-cab small { font-size: 12px; color: var(--muted); }
.escolha { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.escolha button { min-height: 42px; border-radius: 10px; border: 1.5px solid var(--line-strong); background: var(--surface); font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: background .2s, border-color .2s, color .2s; }
.escolha button svg { width: 15px; height: 15px; }
.escolha button[data-st="aprovado"][aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
.escolha button[data-st="ajuste"][aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: var(--on-warn); }
.decisao textarea { min-height: 44px; background: var(--field); border-color: var(--line-strong); color: var(--ink); }
.entre-movel { display: none; }

/* ---------- envio ---------- */
.folha { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: var(--ig-overlay); font-family: var(--f-body);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.folha-caixa { width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: var(--surface); color: var(--ink); border-radius: 18px; padding: 24px; display: grid; gap: 14px; animation: sobe .3s cubic-bezier(.22,.8,.24,1) both; }
.folha-caixa h2 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 23px; }
.folha-caixa > p { margin: 0; color: var(--muted); }
.resumo { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.resumo li { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.resumo img { width: 44px; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 4px; }
.resumo b { font-weight: 600; }
.resumo small { display: block; color: var(--muted); font-size: 12.5px; }
.resumo .st { font-size: 12px; font-weight: 600; }
.resumo .st[data-st="aprovado"] { color: var(--ok); } .resumo .st[data-st="ajuste"] { color: var(--warn-ink); }
.linha2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
#txt-copia { min-height: 110px; font-size: 12.5px; background: var(--field); border-color: var(--line-strong); color: var(--ink); }
#copia-status { margin: 0; font-size: 13px; color: var(--muted); min-height: 1.2em; }

/* ---------- telas médias e celular ---------- */
@media (max-width: 1060px) { .post { --h: min(calc(100vh - 60px), 720px, calc((100vw - 128px - 340px) * 1.25)); } .lado { width: 340px; } }
@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .topo { display: flex; align-items: center; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    padding-block: 9px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--surface); color: var(--ink); border-bottom: 1px solid var(--line); font-family: var(--f-body); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--surface); }

        db.collection("respostas").onSnapshot(function (snap) {
          snap.docs.forEach(function (doc) {

            var v = doc.data() || {};
            R[doc.id] = { status: v.status || null, comentario: v.comentario || "", edicoes: Object.assign({}, v.edicoes || {}), legenda: v.legenda == null ? null : v.legenda };
          });
          guardarLocal(); pintarEstados();

  POSTS.forEach(function (p) {
    var li = document.createElement("li");
    li.innerHTML = '<button class="item" type="button" data-id="' + esc(p.id) + '"><img src="' + p.thumb + '" alt="">' +
      "<span><b>" + num(p.num) + " · " + esc(p.rotulo) + "</b><small>" + (p.dataCurta ? esc(p.dataCurta) + " · " : "") + (p.slides > 1 ? p.slides + " slides" : p.tipo) + "</small></span>" +
      '<span class="pt" data-pt="' + esc(p.id) + '"></span></button>';
    $("lista").appendChild(li);
  });
  $("lista").addEventListener("click", function (e) { var b = e.target.closest(".item"); if (b) { fecharLista(); abrir(porId[b.dataset.id], b); } });
  function fecharLista() { $("lateral").classList.remove("aberta"); $("veu").hidden = true; $("abrir-lista").setAttribute("aria-expanded", "false"); }
  $("abrir-lista").addEventListener("click", function () {
    var abre = !$("lateral").classList.contains("aberta");
    $("lateral").classList.toggle("aberta", abre); $("veu").hidden = !abre;
    this.setAttribute("aria-expanded", abre ? "true" : "false");
  });
  $("veu").addEventListener("click", fecharLista);

  function pintarEstados() {
    document.querySelectorAll("[data-selo]").forEach(function (el) {
      var id = el.dataset.selo, r = R[id], st = r && r.status;
      if (st) { el.dataset.st = st; } else el.removeAttribute("data-st");
      var txt = st === "aprovado" ? (temEdicao(id) ? "Aprovado c/ alterações" : "Aprovado") : st === "ajuste" ? "Ajuste" : "Pendente";
      el.innerHTML = "<i>" + (st === "aprovado" ? OK : st === "ajuste" ? LAPIS : "") + "</i><b>" + txt + "</b>";
      el.title = txt;
    });
    document.querySelectorAll("[data-pt]").forEach(function (el) {
      var st = R[el.dataset.pt] && R[el.dataset.pt].status;
      if (st) el.dataset.st = st; else el.removeAttribute("data-st");
      el.innerHTML = st === "aprovado" ? OK : st === "ajuste" ? LAPIS : "";
    });
    document.querySelectorAll(".item").forEach(function (b) { b.setAttribute("aria-current", atual && b.dataset.id === atual.id ? "true" : "false"); });
    var feitos = POSTS.filter(function (p) { return R[p.id] && R[p.id].status; }).length;
    $("barra").style.width = (POSTS.length ? feitos / POSTS.length * 100 : 0) + "%";
    $("prog-txt").textContent = feitos + " de " + POSTS.length + " posts revisados";
    $("prog-topo").textContent = feitos + " de " + POSTS.length + " revisados";
  }

  /* ---------- post aberto ---------- */
  var atual = null, idx = 0, nSlides = 1, frameDoc = null, campos = [], porCampo = {}, moldes = {}, origem = null, editando = false;
  var palco = $("palco"), palcoIn = $("palco-in");

  function abrir(p, de) {
    if (de) origem = de;
    atual = p; idx = 0;
    $("viewer").hidden = false;
    document.body.classList.add("travado");
    $("v-num").textContent = "Post " + num(p.num) + (p.slides > 1 ? " · " + p.slides + " slides" : "");
    $("v-titulo").textContent = p.titulo;
    $("v-data").textContent = p.dataLonga || "";
    var i = POSTS.indexOf(p);
    $("v-pos").textContent = "Post " + (i + 1) + " de " + POSTS.length;
    $("post-ant").disabled = $("m-ant").disabled = i === 0;
    $("post-prox").disabled = $("m-prox").disabled = i === POSTS.length - 1;
    montarMidia(p);
    sincronizarPainel();
    modoEdicao(editando);
    $("viewer").scrollTop = 0; document.querySelector(".post").scrollTop = 0;
    pintarEstados();
    $("fechar").focus({ preventScroll: true });
  }
  function fechar() {
    $("viewer").hidden = true;
    document.body.classList.remove("travado");
    palcoIn.innerHTML = ""; frameDoc = null; atual = null;
    pintarEstados();
    if (origem && origem.focus) origem.focus({ preventScroll: true });
  }
  function irPost(d) { var i = POSTS.indexOf(atual) + d; if (i >= 0 && i < POSTS.length) abrir(POSTS[i]); }
  $("fechar").addEventListener("click", fechar);
  $("voltar").addEventListener("click", fechar);
  $("viewer").addEventListener("click", function (e) { if (e.target === this) fechar(); });
  $("post-ant").addEventListener("click", function () { irPost(-1); });
  $("post-prox").addEventListener("click", function () { irPost(1); });
  $("m-ant").addEventListener("click", function () { irPost(-1); });
  $("m-prox").addEventListener("click", function () { irPost(1); });

  function montarMidia(p) {
    palcoIn.innerHTML = ""; frameDoc = null; campos = []; porCampo = {}; moldes = {};
    document.querySelector(".midia").style.aspectRatio = p.largura + " / " + p.altura;
    nSlides = p.tipo === "carrossel" ? p.slides : 1;
    $("arrasto").hidden = nSlides < 2;
    if (p.tipo === "carrossel") {
      var f = document.createElement("iframe");
      f.setAttribute("sandbox", "allow-same-origin");
      f.setAttribute("title", "Slides do post " + p.num);
      f.setAttribute("tabindex", "-1");
      f.width = p.largura; f.height = p.altura;
      f.addEventListener("load", function () {
        if (atual !== p) return;
        frameDoc = f.contentDocument;
        campos = APCampos.campos(frameDoc);
        campos.forEach(function (c) { porCampo[c.id] = c; moldes[c.id] = APCampos.moldes(c.el); c.original = APCampos.ler(c.el); });
        var r = resp(p.id);
        Object.keys(r.edicoes).forEach(function (id) { if (porCampo[id]) APCampos.escrever(porCampo[id].el, r.edicoes[id], moldes[id]); });
        irPara(idx, false);
        desenharCampos(); desenharPontos();
      });
      f.srcdoc = p.doc;
      palcoIn.appendChild(f);
      requestAnimationFrame(escalar);
    } else if (p.tipo === "imagem") {
      var im = new Image(); im.src = p.midia; im.alt = p.titulo; palcoIn.appendChild(im);
    } else if (p.tipo === "reel") {
      var v = document.createElement("video");
      v.src = p.midia; v.controls = true; v.playsInline = true; v.preload = "metadata"; v.poster = p.thumb;
      var capa = new Image(); capa.src = p.thumb; capa.alt = ""; capa.style.cssText = "position:absolute;inset:0";
      var bt = document.createElement("button");
      bt.className = "play"; bt.type = "button"; bt.setAttribute("aria-label", "Reproduzir vídeo");
      bt.innerHTML = '<span><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>';
      bt.addEventListener("click", function () { bt.remove(); capa.remove(); v.play(); });
      palcoIn.append(v, capa, bt);
    }
    desenharPontos(); atualizarNav();
  }
  function escalar() {
    var f = palcoIn.querySelector("iframe");
    if (f && atual) f.style.transform = "scale(" + palco.clientWidth / atual.largura + ")";
  }
  window.addEventListener("resize", escalar);
  if (window.ResizeObserver) new ResizeObserver(escalar).observe(palco);

  function trilho() { return frameDoc && APCampos.trilho(frameDoc); }
  function irPara(i, anim) {
    idx = Math.max(0, Math.min(nSlides - 1, i));
    var t = trilho();
    if (t) {
      t.style.transition = anim === false || reduz ? "none" : "transform .4s cubic-bezier(.22,.8,.24,1)";
      t.style.transform = "translateX(" + (-idx * atual.passo) + "px)";
    }
    atualizarNav();
    if (editando) desenharCampos();
  }
  function atualizarNav() {
    var um = nSlides < 2;
    $("seta-esq").disabled = um || idx === 0;
    $("seta-dir").disabled = um || idx === nSlides - 1;
    document.querySelectorAll("#pontos button").forEach(function (b, k) { b.setAttribute("aria-current", k === idx ? "true" : "false"); });
  }
  function desenharPontos() {
    var box = $("pontos"); box.innerHTML = "";
    if (nSlides < 2 || !atual) return;
    var r = resp(atual.id);
    for (var k = 0; k < nSlides; k++) {
      var b = document.createElement("button");
      b.type = "button"; b.setAttribute("aria-label", "Ir para o slide " + (k + 1));
      (function (k) { b.addEventListener("click", function () { irPara(k); }); })(k);
      if (Object.keys(r.edicoes).some(function (id) { return porCampo[id] ? porCampo[id].slide === k + 1 : new RegExp("^slide" + (k + 1) + "-").test(id); })) b.classList.add("mudou");
      box.appendChild(b);
    }
    atualizarNav();
  }
  $("seta-esq").addEventListener("click", function () { irPara(idx - 1); });
  $("seta-dir").addEventListener("click", function () { irPara(idx + 1); });

  var arr = null, arrasto = $("arrasto");
  arrasto.addEventListener("pointerdown", function (e) {
    if (nSlides < 2) return;
    arr = { x: e.clientX, s: palco.clientWidth / atual.largura };
    arrasto.setPointerCapture(e.pointerId);
    var t = trilho(); if (t) t.style.transition = "none";
  });
  arrasto.addEventListener("pointermove", function (e) {
    if (!arr) return;
    var dx = (e.clientX - arr.x) / arr.s;
    if ((idx === 0 && dx > 0) || (idx === nSlides - 1 && dx < 0)) dx *= 0.3;
    var t = trilho(); if (t) t.style.transform = "translateX(" + (-idx * atual.passo + dx) + "px)";
  });
  function soltar(e) {
    if (!arr) return;
    var dx = e.clientX - arr.x, lim = palco.clientWidth * 0.15;
    arr = null;
    if (dx < -lim) irPara(idx + 1); else if (dx > lim) irPara(idx - 1); else irPara(idx);
  }
  arrasto.addEventListener("pointerup", soltar);
  arrasto.addEventListener("pointercancel", soltar);

  document.addEventListener("keydown", function (e) {
    if (!$("folha").hidden) { if (e.key === "Escape") fecharFolha(); return; }
    if ($("viewer").hidden) { if (e.key === "Escape") fecharLista(); return; }
    var digitando = /^(TEXTAREA|INPUT)$/.test((document.activeElement || {}).tagName || "");
    if (e.key === "Escape") { if (digitando) document.activeElement.blur(); else fechar(); return; }
    if (digitando) return;
    if (e.key === "ArrowRight") { irPara(idx + 1); e.preventDefault(); }
    if (e.key === "ArrowLeft") { irPara(idx - 1); e.preventDefault(); }
  });

  /* ---------- legenda, edição e decisão ---------- */
  function legendaHtml(t) {
    var nome = "<b>" + esc(HANDLE) + "</b>";
    if (!t) return nome + '<span class="sem-leg">Sem legenda cadastrada para este post.</span>';
    return nome + esc(t).replace(/(^|[\s(])([#@][\wÀ-ÿ._]+)/g, '$1<span class="tag">$2</span>');
  }
  function sincronizarPainel() {
    if (!atual) return;
    var r = resp(atual.id);
    $("v-legenda").innerHTML = legendaHtml(legendaDe(atual));
    var ed = $("ed-legenda");
    if (document.activeElement !== ed) ed.value = legendaDe(atual) || "";
    $("campo-legenda").classList.toggle("mudou", r.legenda != null);
    var cm = $("comentario");
    if (document.activeElement !== cm) cm.value = r.comentario || "";
    cm.placeholder = r.status === "ajuste" ? "O que precisa mudar neste post?" : "Comentário para este post (opcional)";
    document.querySelector(".decisao").classList.toggle("com-coment", !!r.status || !!r.comentario);
    document.querySelectorAll(".escolha button").forEach(function (b) { b.setAttribute("aria-pressed", r.status === b.dataset.st ? "true" : "false"); });
    if (frameDoc) {
      campos.forEach(function (c) {
        var alvo = r.edicoes[c.id] != null ? r.edicoes[c.id] : c.original;
        if (APCampos.ler(c.el) !== alvo) APCampos.escrever(c.el, alvo, moldes[c.id]);
      });
      if (editando) desenharCampos();
    }
    desenharPontos();
  }
  function modoEdicao(on) {
    editando = on;
    $("btn-editar").setAttribute("aria-pressed", on ? "true" : "false");
    $("btn-editar").querySelector("span").textContent = on ? "Ver legenda" : "Editar textos";
    $("sec-leg").hidden = on; $("sec-ed").hidden = !on;
    if (on) desenharCampos();
  }
  $("btn-editar").addEventListener("click", function () { modoEdicao(!editando); });

  function desenharCampos() {
    var box = $("campos"); if (!box || !atual) return;
    if (box.contains(document.activeElement)) return;
    box.innerHTML = "";
    var r = resp(atual.id);
    if (atual.tipo !== "carrossel") { $("ed-nota").textContent = "Este post não tem texto na arte; dá para ajustar a legenda."; return; }
    var doSlide = campos.filter(function (c) { return c.slide === idx + 1; });
    var temMarca = doSlide.some(function (c) { return /\[\[/.test(c.original); });
    $("ed-nota").textContent = (nSlides > 1 ? "Slide " + (idx + 1) + " de " + nSlides + ". " : "") +
      (doSlide.length ? "A arte muda na hora." : "Este slide não tem texto para editar.") +
      (temMarca ? " Trechos entre [[ ]] mantêm o destaque do design." : "");
    doSlide.forEach(function (c) {
      var w = document.createElement("div"), idc = "c-" + c.id;
      w.className = "campo" + (r.edicoes[c.id] != null ? " mudou" : "");
      w.innerHTML = '<label for="' + esc(idc) + '">' + esc(c.papel) + (r.edicoes[c.id] != null ? " <em>alterado</em>" : "") + "</label>";
      var ta = document.createElement("textarea");
      ta.id = idc; ta.rows = Math.min(6, Math.max(2, Math.ceil(c.original.length / 40)));
      ta.value = r.edicoes[c.id] != null ? r.edicoes[c.id] : c.original;
      ta.addEventListener("input", function () {
        var v = ta.value;
        if (v === c.original) delete r.edicoes[c.id]; else r.edicoes[c.id] = v;
        APCampos.escrever(c.el, v, moldes[c.id]);
        var mudou = r.edicoes[c.id] != null;
        w.classList.toggle("mudou", mudou);
        w.querySelector("label").innerHTML = esc(c.papel) + (mudou ? " <em>alterado</em>" : "");
        desenharPontos();
        agendar(atual.id);
      });
      w.appendChild(ta);
      box.appendChild(w);
    });
  }
  $("ed-legenda").addEventListener("input", function () {
    var r = resp(atual.id), v = this.value;
    r.legenda = v === (atual.legenda || "") ? null : v;
    $("campo-legenda").classList.toggle("mudou", r.legenda != null);
    $("v-legenda").innerHTML = legendaHtml(legendaDe(atual));
    agendar(atual.id);
  });
  $("desfazer").addEventListener("click", function () {
    var r = resp(atual.id);
    r.edicoes = {}; r.legenda = null;
    if (document.activeElement) document.activeElement.blur();
    sincronizarPainel(); agendar(atual.id);
  });
  document.querySelectorAll(".escolha button").forEach(function (b) {
    b.addEventListener("click", function () {
      var r = resp(atual.id);
      r.status = r.status === b.dataset.st ? null : b.dataset.st;
      sincronizarPainel(); agendar(atual.id);
      if (r.status === "ajuste") $("comentario").focus();
    });
  });
  $("comentario").addEventListener("input", function () { resp(atual.id).comentario = this.value; agendar(atual.id); });

  /* ---------- envio ---------- */
  function linhasPost(p) {
    var r = R[p.id] || {}, out = [];
    var st = r.status === "aprovado" ? (temEdicao(p.id) ? "aprovado com alterações" : "aprovado") : r.status === "ajuste" ? "pedir ajuste" : "sem resposta";
    var ic = r.status === "aprovado" ? "✅" : r.status === "ajuste" ? "✏️" : "⏳";
    out.push(ic + " POST " + num(p.num) + " · " + p.rotulo + ": " + st);
    if (r.comentario) out.push("   Comentário: " + r.comentario.trim());
    Object.keys(r.edicoes || {}).forEach(function (id) {
      var m = id.match(/^slide(\d+)/), c = (p.campos || []).filter(function (x) { return x.id === id; })[0];
      out.push("   Slide " + (m ? m[1] : "?") + (c ? " (" + c.papel + ")" : "") + ": " + semMarcas(r.edicoes[id]).replace(/\n/g, " / "));
    });
    if (r.legenda != null) out.push("   Nova legenda: " + r.legenda.trim());
    return out;
  }
  function textoResumo() {
    var t = ["Aprovação de conteúdo · " + D.marca.nome + " · " + D.mes, ""];
    POSTS.forEach(function (p) { t = t.concat(linhasPost(p)); });
    return t.join("\n");
  }
  function dadosCompletos() {
    var posts = {};
    POSTS.forEach(function (p) { if (R[p.id]) posts[p.id] = R[p.id]; });
    return JSON.stringify({ chave: D.chave, cliente: D.marca.nome, mes: D.mes, respostas: posts }, null, 1);
  }
  function abrirFolha() {
    var feitos = POSTS.filter(function (p) { return R[p.id] && R[p.id].status; }).length;
    $("folha-sub").textContent = (feitos === POSTS.length
      ? "Todos os posts foram revisados. Envie as respostas para concluir."
      : "Faltam " + (POSTS.length - feitos) + " de " + POSTS.length + " posts. Dá para enviar assim mesmo e completar depois.") +
      (db && podeGravar ? " As respostas já estão salvas nesta página; o envio serve de aviso." : "");
    var ul = $("resumo"); ul.innerHTML = "";
    POSTS.forEach(function (p) {
      var r = R[p.id] || {}, li = document.createElement("li"), ls = linhasPost(p);
      var st = r.status === "aprovado" ? (temEdicao(p.id) ? "Aprovado com alterações" : "Aprovado") : r.status === "ajuste" ? "Pedir ajuste" : "Sem resposta";
      li.innerHTML = '<img src="' + p.thumb + '" alt=""><span><b>Post ' + num(p.num) + "</b> · " + esc(p.rotulo) +
        '<small class="st"' + (r.status ? ' data-st="' + r.status + '"' : "") + ">" + st + "</small>" +
        ls.slice(1).map(function (l) { return "<small>" + esc(l.trim()) + "</small>"; }).join("") + "</span>";
      ul.appendChild(li);
    });
    var numero = String(D.whatsapp || "").replace(/\D/g, "");
    $("btn-whats").href = "https://wa.me/" + numero + "?text=" + encodeURIComponent(textoResumo());
    $("copia-status").textContent = ""; $("txt-copia").hidden = true;
    $("folha").hidden = false;
    document.body.classList.add("travado");
    $("btn-whats").focus({ preventScroll: true });
  }
  function fecharFolha() {
    $("folha").hidden = true;
    if ($("viewer").hidden) document.body.classList.remove("travado");
    $("btn-enviar").focus({ preventScroll: true });
  }
  function copiar(txt, msg) {
    var mostra = function () { var ta = $("txt-copia"); ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); $("copia-status").textContent = "Selecione e copie o texto abaixo."; };
    try { navigator.clipboard.writeText(txt).then(function () { $("copia-status").textContent = msg; }, mostra); } catch (e) { mostra(); }
  }
  $("btn-enviar").addEventListener("click", function () { fecharLista(); abrirFolha(); });
  $("folha-fechar").addEventListener("click", fecharFolha);
  $("folha").addEventListener("click", function (e) { if (e.target === this) fecharFolha(); });
  $("btn-copiar").addEventListener("click", function () { copiar(textoResumo(), "Resumo copiado. Cole na conversa com o social media."); });
  $("btn-dados").addEventListener("click", function () { copiar(dadosCompletos(), "Dados copiados, com todos os textos alterados."); });

  pintarEstados();
  ligarBanco();
})();
</script>
